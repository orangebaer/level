<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light" id="metaScheme">
<meta name="theme-color" content="#dee5e5" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="metaStatus">
<meta name="apple-mobile-web-app-title" content="Level">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Level</title>
<style>
  /* All colours come from semantic roles. The values below are only a fallback;
     themes.js defines the schemes and the engine in <head> writes the active one here. */
  :root {
    --bg: #dee5e5; --surface: #9dc5bb; --ink: #5f634f; --mark: #5f634f;
    --text: #000; --on-ink: #fff; --ok: #17b890; --on-ok: #000; --bad: #b15e6c; --on-bad: #000;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body {
    color: var(--text); font-family: var(--font); overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-font-smoothing: antialiased;
  }
  #app {
    height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px;
    padding: max(env(safe-area-inset-top), 10px) max(env(safe-area-inset-right), 18px)
             max(env(safe-area-inset-bottom), 14px) max(env(safe-area-inset-left), 18px);
  }

  /* ---- top pills ---- */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 36px; }
  #modePill { justify-self: start; }
  #tiltPill { justify-self: end; }
  .pill {
    display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 16px;
    border: 2px solid var(--ink); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .pill:empty { visibility: hidden; }
  body.is-level #tiltPill { background: var(--ok); color: var(--on-ok); }

  /* ---- instrument ---- */
  #stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
  svg#vis { height: 100%; max-height: 100%; width: auto; max-width: 100%; aspect-ratio: 1 / 1; overflow: visible; }
  .vial { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }
  .lvring { fill: none; stroke: var(--ok); stroke-width: 9; opacity: 0; transition: opacity .2s; }
  body.is-level .lvring { opacity: 1; }
  .grid line, .grid circle { fill: none; stroke: var(--mark); stroke-opacity: .5; stroke-width: 1.2; }
  .tick { stroke: var(--mark); }
  .target { fill: none; stroke: var(--mark); stroke-width: 2.5; }
  .bubble { fill: var(--bad); stroke: var(--mark); stroke-width: 3; transition: fill .2s; }
  body.is-level .bubble { fill: var(--ok); }
  .chip { fill: var(--bg); }
  .scale-t { fill: var(--text); font: 700 9.5px var(--font); text-anchor: middle; }
  .hidden { display: none !important; }

  /* ---- readouts ---- */
  .readouts { display: grid; grid-template-columns: 1fr 2px 1fr; align-items: stretch; }
  .readouts .rule { background: var(--surface); margin: 8px 0; border-radius: 1px; }
  .read { text-align: center; padding: 0 4px; min-width: 0; }
  .read .cap { font-size: 15px; font-weight: 600; }
  .num {
    display: flex; justify-content: center; align-items: baseline; white-space: nowrap;
    font-size: clamp(52px, 17vw, 78px); font-weight: 500; letter-spacing: -.035em; line-height: 1.04;
    font-variant-numeric: tabular-nums;
  }
  .num .sg { display: inline-block; width: .66em; text-align: right; padding-right: .04em; }
  .num .dg { font-size: .42em; font-weight: 500; margin-left: .08em; align-self: flex-start; padding-top: .2em; letter-spacing: 0; }
  .read .hint { width: fit-content; margin: 2px auto 0; min-height: 28px; padding: 0 12px; border-radius: 14px; font-size: 14px; font-weight: 600; display: flex; align-items: center; }
  .hint.off { background: var(--bad); color: var(--on-bad); border: 2px solid var(--ink); }
  .hint.lv { background: var(--ok); color: var(--on-ok); border: 2px solid var(--ink); }

  /* ---- controls ---- */
  .controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 4px; }
  button {
    font: inherit; font-size: 16px; font-weight: 600; color: var(--text); background: transparent;
    border: 2px solid var(--ink); border-radius: 12px; height: 46px; padding: 0 18px; cursor: pointer;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .seg { display: flex; border: 2px solid var(--ink); border-radius: 12px; padding: 2px; gap: 2px; }
  .seg button { border: 0; height: 38px; padding: 0 12px; border-radius: 8px; font-variant-numeric: tabular-nums; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .actions { display: flex; gap: 8px; }
  #zeroBtn { background: var(--ink); color: var(--on-ink); }
  #resetBtn { padding: 0 14px; }

  /* ---- theme picker ---- */
  .theme-btn { width: 36px; height: 36px; padding: 0; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; }
  .theme-btn svg { width: 18px; height: 18px; }
  .theme-btn circle { fill: var(--ink); }
  #themes { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; justify-content: flex-end; }
  #themes .scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .45); }
  #themes .sheet {
    position: relative; background: var(--bg); border-top: 2px solid var(--ink); border-radius: 22px 22px 0 0;
    padding: 18px 18px max(env(safe-area-inset-bottom), 18px); max-height: 75dvh; overflow: auto; display: flex; flex-direction: column; gap: 10px;
  }
  .sheet-title { font-size: 20px; font-weight: 700; padding: 0 2px 4px; }
  .theme-row { display: flex; align-items: center; gap: 14px; height: 58px; padding: 0 14px 0 10px; text-align: left; width: 100%; }
  .theme-row svg { width: 46px; height: 34px; flex: none; }
  .theme-row .nm { flex: 1; }
  .theme-row[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .theme-row[aria-pressed="true"]::after { content: "\2713"; font-size: 18px; }
  .done { margin-top: 4px; background: var(--ink); color: var(--on-ink); }

  /* ---- start overlay ---- */
  #start {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; text-align: center; padding: 32px; background: var(--bg);
  }
  #start svg { width: 84px; height: 84px; margin-bottom: 6px; }
  #start h1 { margin: 0; font-size: 36px; font-weight: 700; letter-spacing: -.02em; }
  #start p { margin: 0; max-width: 24em; font-size: 17px; line-height: 1.45; }
  #start .go { margin-top: 12px; height: 54px; padding: 0 44px; font-size: 18px; border-radius: 27px; background: var(--ink); color: var(--on-ink); }
  #start small { font-size: 13px; font-weight: 500; }
  #msg { max-width: 26em; font-size: 15px; line-height: 1.4; text-align: left; padding: 10px 14px; border: 2px solid var(--ink); border-left: 6px solid var(--bad); border-radius: 4px; }
  #msg:empty { display: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-height: 640px) { .num { font-size: clamp(44px, 14vw, 62px); } .read .hint { font-size: 13px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
</style>
<script src="themes.js"></script>
<script>
/* Theme engine: applies a scheme from themes.js as CSS variables before first paint. */
(function () {
  var FALLBACK = { id: 'ebony-mint', name: 'Ebony & Mint', scheme: 'light', bg: '#dee5e5', surface: '#9dc5bb', ink: '#5f634f',
    text: '#000000', onInk: '#ffffff', ok: '#17b890', onOk: '#000000', bad: '#b15e6c', onBad: '#000000' };
  var list = (window.LEVEL_THEMES && window.LEVEL_THEMES.length) ? window.LEVEL_THEMES : [FALLBACK];
  var current = null;

  function lin(c) { c /= 255; return c <= .04045 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }
  function lum(h) { var n = parseInt(h.slice(1), 16); return .2126 * lin(n >> 16 & 255) + .7152 * lin(n >> 8 & 255) + .0722 * lin(n & 255); }
  function ratio(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
  function isHex(v) { return typeof v === 'string' && /^#[0-9a-f]{6}$/i.test(v); }

  function check(t) {
    var checks = [['text', 'bg', 4.5], ['onInk', 'ink', 4.5], ['onOk', 'ok', 4.5], ['onBad', 'bad', 4.5], ['mark', 'surface', 3], ['ink', 'bg', 3]];
    checks.forEach(function (c) {
      var r = ratio(t[c[0]], t[c[1]]);
      if (r < c[2]) console.warn('[theme ' + t.id + '] ' + c[0] + ' on ' + c[1] + ' has contrast ' + r.toFixed(1) + ':1 (want ' + c[2] + ':1)');
    });
  }

  function find(id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  function apply(id, persist) {
    var t = find(id) || list[0], full = {}, k;
    for (k in FALLBACK) full[k] = isHex(t[k]) || k === 'id' || k === 'name' || k === 'scheme' ? t[k] : FALLBACK[k];
    full.mark = isHex(t.mark) ? t.mark : full.ink;
    full.id = t.id; full.name = t.name || t.id; full.scheme = t.scheme === 'dark' ? 'dark' : 'light';
    var vars = { bg: 'bg', surface: 'surface', ink: 'ink', mark: 'mark', text: 'text', onInk: 'on-ink', ok: 'ok', onOk: 'on-ok', bad: 'bad', onBad: 'on-bad' };
    var st = document.documentElement.style;
    for (k in vars) st.setProperty('--' + vars[k], full[k]);
    document.getElementById('metaTheme').setAttribute('content', full.bg);
    document.getElementById('metaScheme').setAttribute('content', full.scheme);
    document.getElementById('metaStatus').setAttribute('content', full.scheme === 'dark' ? 'black-translucent' : 'default');
    current = t.id; check(full);
    if (persist) { try { localStorage.setItem('level.theme', t.id); } catch (e) {} }
    if (window.LevelThemes && window.LevelThemes.onChange) window.LevelThemes.onChange(t.id);
  }

  window.LevelThemes = { list: list, apply: apply, current: function () { return current; }, onChange: null };

  var q = null, saved = null;
  try { q = new URLSearchParams(location.search).get('theme'); saved = localStorage.getItem('level.theme'); } catch (e) {}
  apply(q || saved || list[0].id, !!q);
})();
</script>
</head>
<body>
<div id="app">
  <header>
    <span class="pill" id="modePill">Flat</span>
    <button class="theme-btn" id="themeBtn" aria-label="Color scheme" aria-haspopup="dialog">
      <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="5" cy="5" r="3"/><circle cx="13" cy="5" r="3"/><circle cx="5" cy="13" r="3"/><circle cx="13" cy="13" r="3"/></svg>
    </button>
    <span class="pill" id="tiltPill"></span>
  </header>

  <main id="stage">
    <svg id="vis" viewBox="-10 -10 320 320" role="img" aria-label="Bubble level">
      <!-- FLAT: circular vial -->
      <g id="flatG">
        <circle class="lvring" cx="150" cy="150" r="148"/>
        <circle class="vial" cx="150" cy="150" r="140"/>
        <g id="ticks"></g>
        <g class="grid">
          <line x1="150" y1="14" x2="150" y2="112"/><line x1="150" y1="188" x2="150" y2="286"/>
          <line x1="14" y1="150" x2="112" y2="150"/><line x1="188" y1="150" x2="286" y2="150"/>
          <circle cx="150" cy="150" r="57"/><circle cx="150" cy="150" r="114"/>
        </g>
        <g id="lbl1g"><rect class="chip" id="chip1" height="15" rx="7.5"/><text class="scale-t" id="lbl1"></text></g>
        <g id="lbl2g"><rect class="chip" id="chip2" height="15" rx="7.5"/><text class="scale-t" id="lbl2"></text></g>
        <circle id="targetF" class="target" cx="150" cy="150" r="28"/>
        <g id="bubbleF" transform="translate(150 150)"><circle class="bubble" r="22"/></g>
      </g>

      <!-- EDGE: tube vial -->
      <g id="edgeG" class="hidden">
        <rect class="lvring" x="3" y="88" width="294" height="124" rx="62"/>
        <rect class="vial" x="10" y="95" width="280" height="110" rx="55"/>
        <line id="tickL" class="target" x1="110" y1="108" x2="110" y2="192"/>
        <line id="tickR" class="target" x1="190" y1="108" x2="190" y2="192"/>
        <g id="bubbleE" transform="translate(150 150)"><ellipse class="bubble" rx="48" ry="36"/></g>
      </g>
    </svg>
  </main>

  <section class="readouts" aria-label="Angles">
    <div class="read" id="boxA">
      <div class="cap" id="nameA">Left–right</div>
      <div class="num"><span class="sg" id="sgA"></span><span id="vlA">0.0</span><span class="dg">°</span></div>
      <div class="hint" id="hintA">&nbsp;</div>
    </div>
    <div class="rule"></div>
    <div class="read" id="boxB">
      <div class="cap" id="nameB">Front–back</div>
      <div class="num"><span class="sg" id="sgB"></span><span id="vlB">0.0</span><span class="dg">°</span></div>
      <div class="hint" id="hintB">&nbsp;</div>
    </div>
  </section>

  <div class="controls">
    <div class="seg" id="rangeSeg" role="group" aria-label="Bubble range in degrees">
      <button data-r="2" aria-pressed="false">±2°</button>
      <button data-r="10" aria-pressed="true">±10°</button>
      <button data-r="30" aria-pressed="false">±30°</button>
    </div>
    <div class="actions">
      <button id="zeroBtn">Zero</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<div id="themes" class="hidden" role="dialog" aria-modal="true" aria-label="Color scheme">
  <div class="scrim" id="themeScrim"></div>
  <div class="sheet">
    <div class="sheet-title">Color scheme</div>
    <div id="themeList" style="display:flex;flex-direction:column;gap:8px"></div>
    <button class="done" id="themeDone">Done</button>
  </div>
</div>

<div id="start">
  <svg viewBox="0 0 84 84" aria-hidden="true">
    <rect class="vial" x="3" y="22" width="78" height="40" rx="20"/>
    <line class="target" x1="23" y1="29" x2="23" y2="55"/>
    <line class="target" x1="61" y1="29" x2="61" y2="55"/>
    <ellipse class="bubble" style="fill: var(--ok)" cx="42" cy="42" rx="12" ry="10"/>
  </svg>
  <h1>Level</h1>
  <p>Lay your phone flat on a surface, or stand it on an edge. Tap Start and allow motion access.</p>
  <button class="go" id="startBtn">Start</button>
  <div id="msg" role="alert"></div>
  <small>Readings stay on your phone.</small>
</div>
<div class="sr" id="sr" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var DEG = 180 / Math.PI, RAD = Math.PI / 180;
  var EPS_IN = 0.5, EPS_OUT = 0.8;       // degrees: enter / leave "level" (hysteresis)
  var FLAT_ENTER = 0.75, FLAT_EXIT = 0.55;
  var TRAVEL_F = 114, BR_F = 22;         // flat vial: bubble travel and radius
  var TRAVEL_E = 86, BR_E = 48;          // tube vial

  var u = null, flat = true, rangeDeg = 10, cal = { x: 0, y: 0 };
  var lastEventAt = 0, levelA = false, levelB = false, wasLevel = false;
  var bx = 0, by = 0;                    // smoothed bubble position (-1..1)

  function $(id) { return document.getElementById(id); }

  function load() {
    try {
      var c = JSON.parse(localStorage.getItem('level.cal') || 'null');
      if (c && isFinite(c.x) && isFinite(c.y)) cal = c;
      var r = parseFloat(localStorage.getItem('level.range'));
      if (r === 2 || r === 10 || r === 30) rangeDeg = r;
    } catch (e) {}
  }
  function save() {
    try {
      localStorage.setItem('level.cal', JSON.stringify(cal));
      localStorage.setItem('level.range', String(rangeDeg));
    } catch (e) {}
  }

  // ---------- math ----------
  // Up vector in the device frame from W3C Euler angles (alpha is irrelevant):
  // u = third row of Rz(a)·Rx(b)·Ry(g) = [-cos b sin g, sin b, cos b cos g]
  function upFromEuler(betaDeg, gammaDeg) {
    var b = betaDeg * RAD, g = gammaDeg * RAD;
    return { x: -Math.cos(b) * Math.sin(g), y: Math.sin(b), z: Math.cos(b) * Math.cos(g) };
  }
  function screenAngle() {
    var a = 0;
    if (screen.orientation && typeof screen.orientation.angle === 'number') a = screen.orientation.angle;
    else if (typeof window.orientation === 'number') a = window.orientation;
    return ((Math.round(a / 90) * 90) % 360 + 360) % 360;
  }
  function toScreen(v, angle) {
    switch (angle) {
      case 90:  return { x: -v.y, y:  v.x, z: v.z };
      case 180: return { x: -v.x, y: -v.y, z: v.z };
      case 270: return { x:  v.y, y: -v.x, z: v.z };
      default:  return { x:  v.x, y:  v.y, z: v.z };
    }
  }
  function asinDeg(x) { return Math.asin(Math.max(-1, Math.min(1, x))) * DEG; }
  function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
  function hyst(prev, a) { return prev ? a < EPS_OUT : a < EPS_IN; }

  // ---------- sensor ----------
  function onOrientation(e) {
    if (e.beta == null || e.gamma == null) return;
    lastEventAt = performance.now();
    var n = upFromEuler(e.beta, e.gamma);
    if (!u) { u = n; return; }
    var k = 0.22;
    u.x += k * (n.x - u.x); u.y += k * (n.y - u.y); u.z += k * (n.z - u.z);
    var m = Math.hypot(u.x, u.y, u.z) || 1;
    u.x /= m; u.y /= m; u.z /= m;
  }
  function startSensors() {
    window.addEventListener('deviceorientation', onOrientation, true);
    if (navigator.wakeLock && navigator.wakeLock.request) {
      var req = function () { navigator.wakeLock.request('screen').catch(function () {}); };
      req();
      document.addEventListener('visibilitychange', function () { if (!document.hidden) req(); });
    }
  }
  function requestAccess() {
    var msg = $('msg'); msg.textContent = '';
    var DOE = window.DeviceOrientationEvent;
    if (!DOE) { msg.textContent = 'This browser has no motion sensors.'; return; }
    var proceed = function () {
      $('start').classList.add('hidden');
      startSensors();
      setTimeout(function () {
        if (!lastEventAt) {
          $('start').classList.remove('hidden');
          msg.textContent = 'No motion data arrived. Open this page over HTTPS on a phone; computers have no tilt sensor.';
        }
      }, 1500);
    };
    if (typeof DOE.requestPermission === 'function') {
      DOE.requestPermission().then(function (state) {
        if (state === 'granted') proceed();
        else msg.textContent = 'Motion access is off. Quit Safari, reopen this page and tap Start again. If that fails, clear this site under Settings, Safari, Advanced, Website Data.';
      }).catch(function (err) {
        msg.textContent = 'Could not ask for motion access (' + (err && err.message ? err.message : err) + '). The page must be served over HTTPS.';
      });
    } else proceed();
  }

  // ---------- scale furniture ----------
  var SVGNS = 'http://www.w3.org/2000/svg';
  function buildTicks() {
    var g = $('ticks');
    for (var i = 0; i < 72; i++) {
      var a = i * 5 * RAD, major = i % 18 === 0, mid = i % 6 === 0;
      var r1 = 133, r0 = major ? 122 : (mid ? 126 : 129);
      var l = document.createElementNS(SVGNS, 'line');
      l.setAttribute('x1', (150 + r0 * Math.sin(a)).toFixed(2)); l.setAttribute('y1', (150 - r0 * Math.cos(a)).toFixed(2));
      l.setAttribute('x2', (150 + r1 * Math.sin(a)).toFixed(2)); l.setAttribute('y2', (150 - r1 * Math.cos(a)).toFixed(2));
      l.setAttribute('class', 'tick');
      l.setAttribute('stroke-width', major ? '2.4' : (mid ? '1.6' : '1'));
      g.appendChild(l);
    }
  }
  // label chip centred on the lower-right diagonal, where it crosses no axis line
  function placeChip(n, r, text) {
    var c = r * Math.SQRT1_2, cx = 150 + c, cy = 150 + c;
    var w = text.length * 6.6 + 12;
    var t = $('lbl' + n), chip = $('chip' + n);
    t.textContent = text; t.setAttribute('x', cx.toFixed(1)); t.setAttribute('y', (cy + 3.4).toFixed(1));
    chip.setAttribute('x', (cx - w / 2).toFixed(1)); chip.setAttribute('y', (cy - 7.5).toFixed(1)); chip.setAttribute('width', w.toFixed(1));
  }
  function layoutScale() {
    var tf = BR_F + 3 + (EPS_IN / rangeDeg) * TRAVEL_F;
    $('targetF').setAttribute('r', tf.toFixed(1));
    var te = BR_E + 4 + (EPS_IN / rangeDeg) * TRAVEL_E;
    $('tickL').setAttribute('x1', (150 - te).toFixed(1)); $('tickL').setAttribute('x2', (150 - te).toFixed(1));
    $('tickR').setAttribute('x1', (150 + te).toFixed(1)); $('tickR').setAttribute('x2', (150 + te).toFixed(1));
    placeChip(1, TRAVEL_F / 2, (rangeDeg / 2) + '°');
    placeChip(2, TRAVEL_F, rangeDeg + '°');
  }

  // ---------- rendering ----------
  var lastTextAt = 0, lastMode = '';
  function setNum(sg, vl, v) {
    var s = Math.abs(v).toFixed(1);
    $(sg).textContent = s === '0.0' ? '' : (v < 0 ? '−' : '+');
    $(vl).textContent = s;
  }
  function setMode(isFlat) {
    flat = isFlat;
    $('flatG').classList.toggle('hidden', !isFlat);
    $('edgeG').classList.toggle('hidden', isFlat);
  }
  function hintLR(d) { return Math.abs(d) < 0.05 ? '' : (d > 0 ? 'right side higher' : 'left side higher'); }
  function hintFB(d) { return Math.abs(d) < 0.05 ? '' : (d > 0 ? 'top edge higher' : 'bottom edge higher'); }
  function arrowLR(d) { return Math.abs(d) < 0.05 ? '' : (d > 0 ? '→ ' : '← '); }
  function arrowFB(d) { return Math.abs(d) < 0.05 ? '' : (d > 0 ? '↑ ' : '↓ '); }
  function setHint(id, lvl, arrow, text) {
    var el = $(id), t = arrow + text;
    el.textContent = lvl ? '\u2713 Level' : (t || '\u00a0');
    el.className = 'hint ' + (lvl ? 'lv' : (t ? 'off' : ''));
  }
  function setLabels(mode, a, b) {
    var key = mode + '|' + a + '|' + b;
    if (key === lastMode) return;
    lastMode = key;
    $('modePill').textContent = mode; $('nameA').textContent = a; $('nameB').textContent = b;
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!u) return;

    var az = Math.abs(u.z);
    if (flat && az < FLAT_EXIT) setMode(false);
    else if (!flat && az > FLAT_ENTER) setMode(true);

    var v = { x: u.x, y: u.y, z: u.z };
    var faceDown = v.z < 0;
    if (flat && !faceDown) {
      v.x -= cal.x; v.y -= cal.y;
      v.z = Math.sqrt(Math.max(0, 1 - v.x * v.x - v.y * v.y));
    }
    var s = toScreen(v, screenAngle());
    var total = Math.acos(clamp(Math.abs(v.z), 0, 1)) * DEG;
    var A, B, tx, ty, horizX = true;

    if (flat) {
      A = asinDeg(s.x); B = asinDeg(s.y);                // + right higher / + top higher
      var mag = Math.hypot(A, B) / rangeDeg;
      tx = A / rangeDeg; ty = B / rangeDeg;
      if (mag > 1) { tx /= mag; ty /= mag; }
      setLabels(faceDown ? 'Flat, face down' : 'Flat', 'Left–right', 'Front–back');
    } else {
      horizX = Math.abs(s.y) >= Math.abs(s.x);
      A = horizX ? Math.atan2(s.x, Math.abs(s.y)) * DEG : Math.atan2(s.y, Math.abs(s.x)) * DEG;
      B = asinDeg(v.z);                                  // + screen faces up
      tx = clamp(A / rangeDeg, -1, 1); ty = 0;
      setLabels('On edge', horizX ? 'Left–right' : 'Top–bottom', 'Screen lean');
    }

    levelA = hyst(levelA, Math.abs(A));
    levelB = flat ? hyst(levelB, Math.abs(B)) : false;
    var isLevel = flat ? (levelA && levelB) : levelA;

    // bubble eases toward its target
    bx += (tx - bx) * 0.4; by += (ty - by) * 0.4;
    if (flat) {
      $('bubbleF').setAttribute('transform', 'translate(' + (150 + bx * TRAVEL_F).toFixed(2) + ' ' + (150 - by * TRAVEL_F).toFixed(2) + ')');
    } else {
      $('edgeG').setAttribute('transform', horizX ? '' : 'rotate(-90 150 150)');
      $('bubbleE').setAttribute('transform', 'translate(' + (150 + bx * TRAVEL_E).toFixed(2) + ' 150)');
    }

    if (isLevel !== wasLevel) {
      wasLevel = isLevel;
      document.body.classList.toggle('is-level', isLevel);
      $('sr').textContent = isLevel ? 'Level' : '';
    }
    $('boxA').classList.toggle('ok', levelA);
    $('boxB').classList.toggle('ok', levelB);

    if (now - lastTextAt > 90) {
      lastTextAt = now;
      setNum('sgA', 'vlA', A); setNum('sgB', 'vlB', B);
      if (flat) {
        setHint('hintA', levelA, arrowLR(A), hintLR(A));
        setHint('hintB', levelB, arrowFB(B), hintFB(B));
      } else {
        setHint('hintA', levelA, horizX ? arrowLR(A) : arrowFB(A), horizX ? hintLR(A) : hintFB(A));
        $('hintB').textContent = B > 0.05 ? 'screen faces up' : (B < -0.05 ? 'screen faces down' : 'screen upright');
        $('hintB').className = 'hint';
      }
      var tp = $('tiltPill');
      if (isLevel) tp.textContent = '✓ Level';
      else if (flat) tp.textContent = 'Slope ' + total.toFixed(1) + '° (' + (Math.tan(total * RAD) * 100).toFixed(1) + '%)';
      else tp.textContent = '';
    }
  }

  // ---------- controls ----------
  function syncRange() {
    var bs = document.querySelectorAll('#rangeSeg button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', parseFloat(bs[i].dataset.r) === rangeDeg ? 'true' : 'false');
    layoutScale();
  }
  $('rangeSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    rangeDeg = parseFloat(b.dataset.r); save(); syncRange();
  });
  $('zeroBtn').addEventListener('click', function () {
    if (!u || !flat || u.z < 0) { alert('Lay the phone flat, screen up, on the surface you want as zero. Then tap Zero.'); return; }
    cal = { x: u.x, y: u.y }; save();
  });
  $('resetBtn').addEventListener('click', function () { cal = { x: 0, y: 0 }; save(); });
  $('startBtn').addEventListener('click', requestAccess);


  // ---------- colour scheme picker ----------
  function themeIcon(t) {
    var mk = /^#[0-9a-f]{6}$/i.test(t.mark) ? t.mark : t.ink;
    return '<svg viewBox="0 0 46 34" aria-hidden="true"><rect x="1" y="1" width="44" height="32" rx="8" fill="' + t.bg + '" stroke="' + t.ink + '" stroke-width="2"/>' +
      '<circle cx="16" cy="17" r="10" fill="' + t.surface + '" stroke="' + t.ink + '" stroke-width="2"/><circle cx="16" cy="17" r="4" fill="' + t.bad + '" stroke="' + mk + '" stroke-width="1.5"/>' +
      '<circle cx="35" cy="11" r="4.5" fill="' + t.ok + '"/><circle cx="35" cy="23.5" r="4.5" fill="' + t.bad + '"/></svg>';
  }
  function buildThemeList() {
    var box = $('themeList'); box.innerHTML = '';
    window.LevelThemes.list.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'theme-row'; b.dataset.id = t.id;
      b.innerHTML = themeIcon(t) + '<span class="nm"></span>';
      b.querySelector('.nm').textContent = t.name || t.id;
      box.appendChild(b);
    });
    syncThemeRows();
  }
  function syncThemeRows() {
    var rows = document.querySelectorAll('.theme-row'), cur = window.LevelThemes.current();
    for (var i = 0; i < rows.length; i++) rows[i].setAttribute('aria-pressed', rows[i].dataset.id === cur ? 'true' : 'false');
  }
  function openThemes(open) { $('themes').classList.toggle('hidden', !open); if (open) $('themeDone').focus(); else $('themeBtn').focus(); }
  $('themeBtn').addEventListener('click', function () { openThemes(true); });
  $('themeDone').addEventListener('click', function () { openThemes(false); });
  $('themeScrim').addEventListener('click', function () { openThemes(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') openThemes(false); });
  $('themeList').addEventListener('click', function (e) {
    var b = e.target.closest('.theme-row'); if (!b) return;
    window.LevelThemes.apply(b.dataset.id, true);
  });
  window.LevelThemes.onChange = syncThemeRows;
  buildThemeList();

  window.__level = { upFromEuler: upFromEuler, toScreen: toScreen, onOrientation: onOrientation };

  buildTicks(); load(); syncRange();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
